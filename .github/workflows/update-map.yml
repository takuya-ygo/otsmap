name: Update and deploy OTS map

on:
  workflow_dispatch:
  schedule:
    # 毎日 03:17 JST（前日18:17 UTC）
    - cron: '17 18 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ots-map-update-and-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEOCODING_API_KEY: ${{ secrets.GEOCODING_API_KEY }}
      MINIMUM_STORE_COUNT: '50'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape, geocode, and validate
        run: npm run update

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw-stores.json data/geocode-cache.json docs/stores.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update OTS map data"
            git push
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ots-map-diagnostics
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
